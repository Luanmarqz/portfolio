    const useTypingEffect = (strings, speed = 80, pause = 2000) => {
      const [displayedText, setDisplayedText] = useState("");
      const [stringIndex, setStringIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        const currentFullText = strings[stringIndex];

        const handleTyping = () => {
          if (!isDeleting) {
            setDisplayedText(currentFullText.substring(0, displayedText.length + 1));
            if (displayedText === currentFullText) {
              setTimeout(() => setIsDeleting(true), pause);
            }
          } else {
            setDisplayedText(currentFullText.substring(0, displayedText.length - 1));
            if (displayedText === "") {
              setIsDeleting(false);
              setStringIndex((prev) => (prev + 1) % strings.length);
            }
          }
        };

        const timer = setTimeout(handleTyping, isDeleting ? speed / 2 : speed);
        return () => clearTimeout(timer);
      }, [displayedText, isDeleting, stringIndex, strings, speed, pause]);

      return displayedText;
    };

                        onError={(e) => {

                          e.target.src = "https://github.com/Luanmarqz.png";
                        }}
                      />
                      <div className="absolute -bottom-2 -right-2 bg-gray-900 border border-gray-700 p-2 rounded-xl text-cyan-400 shadow-lg">
                        <i data-lucide="code" className="w-5 h-5"></i>
                      </div>
                    </div>

                    <h2 className="text-xl font-bold text-white mb-1">{PORTFOLIO_DATA.name}</h2>
                    <p className="text-xs font-mono text-cyan-400 mb-4">{PORTFOLIO_DATA.location}</p>

                    <div className="w-full border-t border-gray-800 pt-4 mt-2 space-y-2 text-left">
                      <div className="flex items-center gap-2 text-xs text-gray-300">
                        <i data-lucide="graduation-cap" className="w-4 h-4 text-cyan-400 shrink-0"></i>
                        <span>{PORTFOLIO_DATA.education}</span>
                      </div>
                      <div className="flex items-center gap-2 text-xs text-gray-300">
                        <i data-lucide="mail" className="w-4 h-4 text-cyan-400 shrink-0"></i>
                        <span className="truncate">{PORTFOLIO_DATA.email}</span>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>
          </section>

          {/* --- ABOUT SECTION --- */}
          <section id="sobre" className="py-16 px-4 sm:px-8 max-w-6xl mx-auto w-full">
            <div className="glass-card p-6 sm:p-10 rounded-3xl border border-gray-800">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                
                <div className="md:col-span-4 flex justify-center">
                  <img 
                    src={PORTFOLIO_DATA.profileImage} 
                    alt="Sobre Luhan Marques" 
                    className="w-full max-w-xs h-72 sm:h-80 object-cover rounded-2xl border border-gray-700 shadow-xl"
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = "https://github.com/Luanmarqz.png";
                    }}
                  />
                </div>

                <div className="md:col-span-8 space-y-6">
                  <div>
                    <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-1">Biografia</span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Sobre Mim</h2>
                    <p className="text-gray-300 text-sm sm:text-base leading-relaxed mt-3">
                      {PORTFOLIO_DATA.bioAbout}
                    </p>
                  </div>

                  <div className="border-t border-gray-800 pt-5">
                    <h3 className="text-lg font-bold text-white mb-2">Trajetória</h3>
                    <p className="text-gray-300 text-sm leading-relaxed">
                      {PORTFOLIO_DATA.bioTrajectory}
                    </p>
                  </div>
                </div>

              </div>
            </div>
          </section>

          {/* --- SERVICES SECTION --- */}
          <section id="servicos" className="py-16 px-4 sm:px-8 max-w-6xl mx-auto w-full">
            <div className="text-center max-w-xl mx-auto mb-12">
              <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-2">O que eu faço</span>
              <h2 className="text-2xl sm:text-4xl font-extrabold text-white">Meus Serviços</h2>
              <p className="text-gray-400 text-xs sm:text-sm mt-2">Aqui estão alguns dos serviços que ofereço como desenvolvedor.</p>
              <div className="w-12 h-1 bg-gradient-to-r from-cyan-500 to-indigo-500 mx-auto mt-3 rounded-full"></div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {PORTFOLIO_DATA.services.map((srv, idx) => (
                <div key={idx} className="glass-card p-6 rounded-2xl border border-gray-800 hover:border-cyan-500/40 transition-all duration-300 group hover:-translate-y-1">
                  <div className="w-12 h-12 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center mb-5 group-hover:bg-cyan-500 group-hover:text-white transition-colors">
                    <i data-lucide={srv.icon} className="w-6 h-6"></i>
                  </div>
                  <span className="text-xs font-mono text-cyan-400 block mb-1">{srv.subtitle}</span>
                  <h3 className="text-xl font-bold text-white mb-3">{srv.title}</h3>
                  <p className="text-gray-400 text-sm leading-relaxed">{srv.description}</p>
                </div>
              ))}
            </div>
          </section>

          {/* --- SPECIALTIES / SKILLS SECTION --- */}
          <section id="especialidade" className="py-16 px-4 sm:px-8 max-w-6xl mx-auto w-full">
            <div className="text-center max-w-xl mx-auto mb-12">
              <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-2">Stack & Habilidades</span>
              <h2 className="text-2xl sm:text-4xl font-extrabold text-white">Minhas Especialidades</h2>
              <p className="text-gray-400 text-xs sm:text-sm mt-2">Tecnologias com as quais trabalho no meu dia a dia.</p>
              <div className="w-12 h-1 bg-gradient-to-r from-cyan-500 to-indigo-500 mx-auto mt-3 rounded-full"></div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
              {PORTFOLIO_DATA.skills.map((skill, idx) => (
                <div key={idx} className="glass-card p-6 rounded-2xl border border-gray-800">
                  <div className="flex items-center justify-between mb-3">
                    <div>
                      <span className="text-xs font-mono text-cyan-400 block">{skill.category}</span>
                      <h3 className="text-base font-bold text-white mt-0.5">{skill.name}</h3>
                    </div>
                    <span className="text-sm font-mono text-gray-400 font-semibold">{skill.level}%</span>
                  </div>

                  <div className="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden">
                    <div 
                      className="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full rounded-full transition-all duration-1000"
                      style={{ width: `${skill.level}%` }}
                    ></div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* --- PROJECTS SECTION --- */}
          <section id="projetos" className="py-16 px-4 sm:px-8 max-w-6xl mx-auto w-full">
            <div className="text-center max-w-xl mx-auto mb-12">
              <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-2">Portfólio</span>
              <h2 className="text-2xl sm:text-4xl font-extrabold text-white">Meus Projetos</h2>
              <p className="text-gray-400 text-xs sm:text-sm mt-2">Aqui estão alguns dos meus principais projetos desenvolvidos.</p>
              <div className="w-12 h-1 bg-gradient-to-r from-cyan-500 to-indigo-500 mx-auto mt-3 rounded-full"></div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
              {PORTFOLIO_DATA.projects.map((proj) => (
                <div 
                  key={proj.id}
                  className="glass-card rounded-2xl overflow-hidden border border-gray-800 hover:border-gray-700 transition-all duration-300 flex flex-col group"
                >
                  <div className="relative h-48 sm:h-52 overflow-hidden bg-gray-900">
                    <img 
                      src={proj.image} 
                      alt={proj.title}
                      className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80";
                      }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent opacity-80"></div>
                  </div>

                  <div className="p-6 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 className="text-xl font-bold text-white mb-1.5 group-hover:text-cyan-400 transition-colors">
                        {proj.title}
                      </h3>
                      <p className="text-xs font-mono text-cyan-400 mb-3">{proj.tech}</p>
                      <p className="text-gray-400 text-sm leading-relaxed mb-4">
                        {proj.description}
                      </p>
                    </div>

                    <div>
                      <div className="flex flex-wrap gap-1.5 mb-5">
                        {proj.tags.map((t, tIdx) => (
                          <span key={tIdx} className="px-2 py-0.5 rounded text-[11px] font-mono bg-gray-800 text-gray-300">
                            {t}
                          </span>
                        ))}
                      </div>

                      <div className="flex items-center gap-3 pt-3 border-t border-gray-800">
                        <a 
                          href={proj.liveUrl} 
                          target="_blank" 
                          rel="noreferrer"
                          className="flex-1 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white text-xs font-semibold transition-colors flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20"
                        >
                          <i data-lucide="external-link" className="w-4 h-4"></i> Acessar Projeto
                        </a>
                      </div>
                    </div>

                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* --- CONTACT SECTION --- */}
          <section id="contato" className="py-16 px-4 sm:px-8 max-w-4xl mx-auto w-full">
            <div className="text-center max-w-xl mx-auto mb-10">
              <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest block mb-2">Fale Conosco</span>
              <h2 className="text-2xl sm:text-4xl font-extrabold text-white">Entre em Contato</h2>
              <p className="text-gray-400 text-xs sm:text-sm mt-2">
                Estou disponível para novas oportunidades, projetos e parcerias. Fale comigo diretamente através de um dos canais abaixo:
              </p>
              <div className="w-12 h-1 bg-gradient-to-r from-cyan-500 to-indigo-500 mx-auto mt-3 rounded-full"></div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {/* Card WhatsApp Direct */}
              <a 
                href={`https://api.whatsapp.com/send?phone=${PORTFOLIO_DATA.whatsapp}`} 
                target="_blank" 
                rel="noreferrer"
                className="glass-card p-5 rounded-2xl border border-emerald-500/30 hover:border-emerald-400 transition-all flex items-center gap-4 group hover:-translate-y-0.5"
              >
                <div className="p-3.5 rounded-xl bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-white transition-colors shrink-0">
                  <WhatsappIcon className="w-6 h-6" />
                </div>
                <div>
                  <span className="block text-xs text-emerald-400 font-mono font-semibold uppercase tracking-wider">Conversa Direta</span>
                  <span className="text-base font-bold text-white group-hover:text-emerald-300 transition-colors">WhatsApp</span>
                </div>
              </a>

              {/* Card Email com clique para copiar */}
              <div 
                onClick={() => copyToClipboard(PORTFOLIO_DATA.email, "Email")}
                className="glass-card p-5 rounded-2xl border border-gray-800 hover:border-cyan-500/50 transition-all flex items-center gap-4 cursor-pointer group hover:-translate-y-0.5"
              >
                <div className="p-3.5 rounded-xl bg-cyan-500/10 text-cyan-400 group-hover:bg-cyan-500 group-hover:text-white transition-colors shrink-0">
                  <i data-lucide="mail" className="w-6 h-6"></i>
                </div>
                <div className="min-w-0 flex-1">
                  <span className="block text-xs text-cyan-400 font-mono uppercase tracking-wider">Email (clique p/ copiar)</span>
                  <span className="text-sm font-semibold text-white group-hover:text-cyan-300 transition-colors truncate block">
                    {PORTFOLIO_DATA.email}
                  </span>
                </div>
              </div>

              {/* Card LinkedIn */}
              <a 
                href={PORTFOLIO_DATA.linkedin} 
                target="_blank" 
                rel="noreferrer"
                className="glass-card p-5 rounded-2xl border border-gray-800 hover:border-cyan-500/50 transition-all flex items-center gap-4 group hover:-translate-y-0.5"
              >
                <div className="p-3.5 rounded-xl bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition-colors shrink-0">
                  <LinkedinIcon className="w-6 h-6" />
                </div>
                <div>
                  <span className="block text-xs text-indigo-400 font-mono uppercase tracking-wider">Rede Profissional</span>
                  <span className="text-base font-bold text-white group-hover:text-cyan-300 transition-colors">LinkedIn</span>
                </div>
              </a>

              {/* Card GitHub */}
              <a 
                href={PORTFOLIO_DATA.github} 
                target="_blank" 
                rel="noreferrer"
                className="glass-card p-5 rounded-2xl border border-gray-800 hover:border-cyan-500/50 transition-all flex items-center gap-4 group hover:-translate-y-0.5"
              >
                <div className="p-3.5 rounded-xl bg-gray-700/30 text-gray-300 group-hover:bg-white group-hover:text-gray-900 transition-colors shrink-0">
                  <GithubIcon className="w-6 h-6" />
                </div>
                <div>
                  <span className="block text-xs text-gray-400 font-mono uppercase tracking-wider">Repositórios</span>
                  <span className="text-base font-bold text-white group-hover:text-cyan-300 transition-colors">GitHub</span>
                </div>
              </a>
            </div>

            {/* Badge de Localização */}
            <div className="mt-6 glass-card p-4 rounded-2xl border border-gray-800/80 flex items-center justify-center gap-3 text-xs text-gray-400 font-mono text-center">
              <i data-lucide="map-pin" className="w-4 h-4 text-cyan-400 shrink-0"></i>
              <span>Baseado em <strong className="text-white">{PORTFOLIO_DATA.location}</strong> • Disponível para trabalho remoto e presencial</span>
            </div>
          </section>

          {/* --- FOOTER --- */}
          <footer className="mt-auto border-t border-gray-800/80 py-8 px-4 text-center text-xs text-gray-500 font-mono">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>© {new Date().getFullYear()} {PORTFOLIO_DATA.name}. Todos os direitos reservados.</p>
              <div className="flex items-center gap-4 text-gray-400">
                <a href="#home" className="hover:text-cyan-400 transition-colors">Home</a>
                <a href="#sobre" className="hover:text-cyan-400 transition-colors">Sobre</a>
                <a href="#projetos" className="hover:text-cyan-400 transition-colors">Projetos</a>
                <a href="#contato" className="hover:text-cyan-400 transition-colors">Contato</a>
              </div>
            </div>
          </footer>

          {/* --- TOAST NOTIFICATION --- */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 glass-card border border-cyan-500/40 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce">
              <i data-lucide="check-circle" className="w-5 h-5 text-cyan-400"></i>
              <span className="text-xs sm:text-sm font-medium">{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Renderizar a aplicação
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
